name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw "smoke.ps1 failed with exit $LASTEXITCODE" }

      - name: Accuracy fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\accuracy.ps1
          if ($LASTEXITCODE -ne 0) { throw "accuracy.ps1 failed with exit $LASTEXITCODE" }

      - name: Upload vitals.png and safety log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitals-png
          path: |
            tests/results/vitals.png
            tests/results/accuracy/
            tests/results/safety-runtime.log
          if-no-files-found: warn

  # Live soak + idle/edge stability on windows-latest (shorter than 2h; see SOAK_SECONDS).
  windows-stability:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Stability soak
        shell: pwsh
        env:
          # Feasible in CI. Full 2h soak is a Known limit (not run here).
          SOAK_SECONDS: '480'
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\stability.ps1
          if ($LASTEXITCODE -ne 0) { throw "stability.ps1 failed with exit $LASTEXITCODE" }

      - name: Upload stability artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stability
          path: |
            tests/results/stability.json
            tests/results/stability.txt
          if-no-files-found: warn

  # x64 build/smoke under Windows 11 Arm64 (Prism / x64 emulation).
  windows-arm:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host ("PROCESSOR_ARCHITECTURE={0}" -f $env:PROCESSOR_ARCHITECTURE)
          Write-Host ("PROCESSOR_ARCHITEW6432={0}" -f $env:PROCESSOR_ARCHITEW6432)
          Write-Host ("OS={0}" -f [Environment]::OSVersion.VersionString)
          $fw = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          Write-Host ("Framework64_csc={0} exists={1}" -f $fw, (Test-Path -LiteralPath $fw))
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed |
            Format-List |
            Out-String |
            Write-Host

      - name: Build and smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw "smoke.ps1 failed with exit $LASTEXITCODE" }

      - name: Accuracy fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\accuracy.ps1
          if ($LASTEXITCODE -ne 0) { throw "accuracy.ps1 failed with exit $LASTEXITCODE" }

      - name: Core layout from vitals.txt
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $txt = Join-Path $PWD 'tests\results\vitals.txt'
          if (-not (Test-Path -LiteralPath $txt)) {
            Write-Host 'cores-split: vitals.txt missing'
            exit 0
          }
          # Redact machine name before logging (first token after product name).
          $raw = [System.IO.File]::ReadAllText($txt)
          $safe = [regex]::Replace($raw, '(?m)^(Desktop Vitals)\s+\S+', '$1 <redacted>')
          Write-Host '----- vitals.txt (redacted) -----'
          Write-Host $safe
          Write-Host '----- end vitals.txt -----'
          if ($safe -match '(?i)performance core|efficiency core') {
            Write-Host 'cores-split: hybrid (performance/efficiency labels present)'
          }
          elseif ($safe -match '(?i)Busiest thread:.*\bcore\b') {
            Write-Host 'cores-split: flat (single efficiency class / core N labels)'
          }
          else {
            Write-Host 'cores-split: inconclusive (no Busiest thread core labels)'
          }

      - name: Upload ARM vitals artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitals-arm
          path: |
            tests/results/vitals.png
            tests/results/vitals.txt
            tests/results/accuracy/
            tests/results/safety-runtime.log
          if-no-files-found: warn

  # Prebuilt exe + checksums for GitHub Release on tag v*.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw "smoke.ps1 failed with exit $LASTEXITCODE" }

      - name: Checksums and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $exe = Join-Path $PWD 'bin\DesktopVitals.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "missing $exe" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = Join-Path $PWD 'SHA256SUMS.txt'
          Set-Content -LiteralPath $sums -Value ("{0}  DesktopVitals.exe" -f $hash) -Encoding ascii
          Write-Host ("SHA256 DesktopVitals.exe = {0}" -f $hash)
          gh release create $tag $exe $sums --title $tag --notes "Desktop Vitals $tag. Unsigned build. See README for SmartScreen."
