name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw "smoke.ps1 failed with exit $LASTEXITCODE" }

      - name: Upload vitals.png
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitals-png
          path: tests/results/vitals.png
          if-no-files-found: warn
