name: build

on:
  push:
    branches: [harden, main]
  pull_request:
    branches: [harden, main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit $LASTEXITCODE" }
